name: Publish

# Publishes when a tag like v0.0.2 is pushed. Requires repo secrets:
#   VSCE_PAT  - Azure DevOps PAT (Marketplace > Manage)
#   OVSX_PAT  - Open VSX token (optional; step is skipped if unset)
on:
  push:
    tags: ['v*']

defaults:
  run:
    working-directory: shift-case

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shift-case/package-lock.json
      - run: npm ci
      - name: Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: xvfb-run -a npm test
      - run: npx @vscode/vsce package --no-dependencies -o shift-case.vsix
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath shift-case.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish shift-case.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: shift-case-vsix
          path: shift-case/shift-case.vsix
