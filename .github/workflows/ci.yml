name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: shift-case

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shift-case/package-lock.json
      - run: npm ci
      - run: npm run check-types
      - run: npm run lint
      - name: Test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

  # Shift Case ships with zero runtime dependencies (see the README); fail if one is added.
  no-runtime-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check package.json has no runtime dependencies
        run: |
          node -e "const d = Object.keys(require('./package.json').dependencies || {}); if (d.length) { console.error('Runtime dependencies are not allowed: ' + d.join(', ')); process.exit(1); }"

  # Runs the same editor tests plus Jupyter notebook-cell tests in VS Code for the
  # Web (headless Chromium via @vscode/test-web).
  web-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shift-case/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
