name: Release Please

# Opens/updates a "chore: release X.Y.Z" PR from conventional commits on main.
# Merging that PR bumps shift-case/package.json + CHANGELOG, creates the vX.Y.Z
# tag and GitHub release; the tag then triggers publish.yml.
#
# Secret RELEASE_PLEASE_TOKEN (a PAT with contents + pull-requests write) is
# needed so the tag push triggers publish.yml; tags/PRs created with the default
# GITHUB_TOKEN do not trigger other workflows.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
